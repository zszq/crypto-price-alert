# 交易用的放量启动提醒：只跑放量启动，参数取回测第五轮推荐的 S5（research/launch_trade/FINDINGS.md「第五轮」）。
# 与日常监控的 config/default.yaml 分开：日常监控调参不会改变交易信号，交易信号也不会让日常提醒变多变少。
# 两个实例可以同时运行（进程锁按配置文件区分）：
#   .\.venv\Scripts\python.exe -m price_alert.cli run --config config/launch-trade.yaml
# 或双击 start-launch-trade.bat。键与取值范围同 default.yaml，那里有每一项的完整说明；这里只写与交易有关的取舍。
# 本文件没写的项（gate 整段等）取 config.py 的代码默认值。
#
# 提醒只负责「何时、哪个币」。下面的交易规则监控程序不执行，由交易程序（或人工）按提醒照做，回测数字以照做为前提：
# - 过热不买：提醒前最后一个已收盘小时，BTC 收盘价高于其 50 日（1200 小时）均价 10% 以上，
#   或全市场站上 30 日（720 小时）均价的 USDT 永续合约超过 75% 时，不开仓。
# - 开仓：提醒后等满 5 根 1 分钟 K 线，下一根的开盘价 ≥ 提醒价 × 1.01 才按它买入，否则放弃这条提醒。
# - 止损：max(等待这 5 分钟内的最低价 × 0.95, 入场价 × 0.80)；算出的止损高于入场价 × 0.995 时改用入场价 × 0.94。
# - 回撤平仓：从持仓期最高价回撤 max(10%, 入场前 60 分钟平均振幅（(高-低)/收）× 3) 时平仓，与止损取较高的一条线。
# - 最长持有 18 小时，到时市价平仓。
# - 仓位：最多同时持 5 仓，每仓本金的 1/5、1 倍杠杆；满仓时新提醒放弃，同一个币已有持仓时不再开。
# 回测（单边成本 0.05%，不复利）：2021-10 ~ 2024-09 三年（未参与选参数）+140%，回撤 54%，最长约一年不创新高；
# 收益集中在少数大行情日，去掉最好 5 天只剩 +14%。改动下面任何一项，这些数字都不再适用，需要按 FINDINGS.md 重跑。

move:
  # 秒级异动由日常监控负责，这里关掉，免得重复订阅和重复提醒。
  enabled: false

trend:
  enabled: false

launch:
  enabled: true
  # 不设合约池下限：回测按全部合约（24h 成交额 > 0）统计，冷门币由下面的窗口成交额门槛挡住；设了下限会漏掉启动前成交少的第一波。
  # 约 600 个合约，启动预热约 1.5 分钟。
  min_volume_24h_quote: 0
  max_volume_24h_quote: null
  window_minutes: 5
  # 360 与 1440 的回测结果相近，取 360：推荐方案的数字按它算，预热也少拉 4 倍 K 线。
  baseline_minutes: 360
  min_volume_ratio: 3.0
  # 回测中最有效的一项：同一套出场与限仓下，门槛从 10 万提到 20 / 30 / 50 万，三年样本外从 -49% 变为 +79% / +104% / +61%。
  min_window_quote: 300000
  # 只买已突破或只买未突破都不比全买稳定，所以不要求突破。
  require_breakout: false
  cooldown_minutes: 10
  # 第 2 波及以后同样买入：选参数的两年里，所有波次都买好于只买第 1 波。
  realert_step_percent: 5.0
  min_change_percent: 3.0
  # 不设涨幅上限，与回测一致：涨得过猛的提醒买不买，交给「5 分钟后仍高于提醒价 1%」的入场条件判断。
  max_change_percent: null
  # 做空下跌放量的利润几乎全部来自 2025-10-11 一天，不可用，只做多。
  alert_drops: false

alerts:
  # 与日常监控分开落盘，交易程序读这个文件；两个实例写同一个文件会互相轮转、交错写入。
  jsonl_path: data/alerts/launch-trade.jsonl
  # Webhook 地址的环境变量 PRICE_ALERT_WEBHOOK_URL 对两个实例同时生效；要分开推送请在这里写地址而不设环境变量。
  webhook_url: null
