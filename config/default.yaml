# Gate.io 虚拟币 USDT 永续合约价格异动监控配置。
# 括号内是 config.py 强制校验的取值范围；未知键直接报错，删掉某项则回落到 config.py 的同名默认值。
# 每项上方的「默认：」即该代码默认值，固定不变；调参只改下方取值，不改这行注释。
# 改动阈值属于行为变更，提交说明中需写明运营影响。

# 交易所连接、合约池筛选与限流。
gate:
  # REST 根地址，用于拉合约列表与 K 线。
  # 默认：https://api.gateio.ws/api/v4
  rest_url: https://api.gateio.ws/api/v4
  # WebSocket 行情地址（futures.trades 逐笔成交），须与 settle 对应。
  # 默认：wss://fx-ws.gateio.ws/v4/ws/usdt
  websocket_url: wss://fx-ws.gateio.ws/v4/ws/usdt
  # 结算币种，目前只支持 usdt。
  # 默认：usdt
  settle: usdt
  # 秒级 ATR 异动的合约池准入门槛：24 小时 USDT 计价成交额须严格大于该值。调低纳入更多小币，异动更频繁但假信号也多。
  # 趋势提醒的合约池单独设置，见 trend.min_volume_24h_quote / trend.max_volume_24h_quote。
  # 默认：10000000
  min_volume_24h_quote: 8000000
  # 退出门槛比例 (0, 1]：已监控合约的成交额低于或等于下限 × 该比例才移除；设了上限的（趋势提醒）超过上限 ÷ 该比例才移除。
  # 秒级异动与趋势提醒共用。这段缓冲避免边界附近的合约每轮刷新反复订阅/退订；越小越黏，等于 1 表示进出同一条线。
  # 默认：0.8
  universe_exit_volume_ratio: 0.8
  # 合约池刷新周期（秒，60~86400）。变化走增量订阅，不断开 WebSocket。
  # 调小更快发现新上线的热门合约，代价是每轮都要拉列表并为新增合约预热 K 线。
  # 默认：600
  universe_refresh_seconds: 600
  # 单个 REST 请求的超时（秒，(0, 60]）。网络慢时调大，否则预热会因超时反复重试。
  # 默认：15
  rest_timeout_seconds: 15
  # 单个 REST 请求的最大尝试次数（1~10，含首次）。只重试 408/429/5xx 与网络、JSON 解析类临时错误。
  # 遇到 429 应调小下面的速率，而不是靠调高这里硬扛。
  # 默认：3
  rest_retries: 3
  # 所有 REST 出口共用的长期平均速率上限（次/秒，(0, 1000]）。交易所按单位时间的请求数限频，
  # 所以上限必须加在时间维度上：合约池再大、重连再频繁，也只是拉长一轮预热或回补的耗时。日志出现 429 就调小。
  # 默认：10
  rest_rate_limit_per_second: 10
  # 令牌桶攒满后可一次放行的瞬时额度（1~1000），让启动预热不必逐个等令牌，是任意一刻的绝对上限。
  # Gate 公共接口每个端点每 10 秒 200 次（平均 20 次/秒），这里所有端点共用一个桶，比官方口径更保守。
  # 默认：20
  rest_rate_limit_burst: 20
  # ATR 预热与断线回补共用的并发上限（1~32），峰值并发不叠加；实际速率仍受令牌桶约束。
  # 默认：8
  warmup_concurrency: 8
  # 单条订阅消息携带的合约数（1~500）。Gate 一批中有一个无效合约就整批失败，之后逐个重订阅定位，
  # 分片过大时这种回退代价更高，过小则订阅轮次变多。
  # 默认：100
  subscription_chunk_size: 100
  # 连续多少秒收不到任何数据消息（成交或订阅应答）就判定连接已死并重连（秒，(0, 300]）。
  # 底层 ping/pong 由 websockets 库独立维持，不重置该计时；调小在全市场冷清时容易误判。
  # 默认：30
  receive_timeout_seconds: 30
  # 实时成交允许的最大滞后（秒，(0, 300]）。链路积压时推送来的已是旧行情，秒级判定失去意义，
  # 故逐笔校验时间戳、超限主动重连清空积压。频繁出现「行情数据滞后」应排查网络而不是调高该值。
  # 默认：10
  max_data_lag_seconds: 10
  # 断线重连的指数退避初始等待（秒，(0, 60]），收到第一笔成交后重置。
  # 默认：1
  reconnect_initial_seconds: 1
  # 退避上限（秒，(0, 300]），不能小于 reconnect_initial_seconds。
  # 调大可减轻交易所故障期间的无效重连，代价是恢复后重新连上更慢。
  # 默认：30
  reconnect_max_seconds: 30
  # 「监控正常」日志的最小间隔（秒，(0, 3600]），打印监控合约数与累计成交笔数。
  # 检查点在每笔成交处理之后，全市场无成交时不会输出，所以不是严格心跳。只影响日志噪音。
  # 默认：60
  status_interval_seconds: 60

# ATR 与异动判定参数。触发条件需全部满足；门槛类条件（基准桶、窗口成交笔数、涨跌幅、ATR 倍数）
# 任一不满足就重置确认进度，而补齐的空秒、空档后价格复核失败只是禁止提醒，确认进度会保留。
indicator:
  # ATR 使用的 K 线周期，仅支持 1m / 5m / 15m。越长 ATR 越平滑、门槛越稳，对波动率变化反应越慢。
  # 默认：1m
  candle_interval: 1m
  # Wilder ATR 的平滑周期（2~200）。调大更平滑、更抗单根异常 K 线，门槛跟随波动率也更慢。
  # 默认：14
  atr_period: 14
  # 启动时预拉的 K 线根数（15~500），必须大于 atr_period。未收盘的当前 K 线不计入 seed
  #（它转去初始化实时 K 线），所以实际可用通常少一根。调大让初始 ATR 更接近稳态，启动 REST 负担更重。
  # 默认：50
  warmup_candles: 50
  # ATR 过期保护（秒，30~3600），按最近一根计入 ATR 的 K 线的收盘时间计算，超过则停止判定。
  # 不能小于两个 K 线周期；删掉该项会自动取三个周期。调大能容忍更长缺口，但可能拿过期波动率发提醒。
  # 默认：未填写时取 3 个 K 线周期（1m 下为 180）
  max_atr_age_seconds: 180
  # 以下两个观察窗口共用上面的 K 线、ATR 和秒级成交数据，门槛、确认和冷却各自独立；
  # 两个窗口互不影响：各自满足即各自提醒，同一秒都满足时各报一条（短窗口在前）。
  # 冷却按窗口各自记录「上次提醒时间」，只从本窗口自己的上一次提醒算起，另一个窗口的提醒不会续上它。
  #
  # 短窗口：捕捉秒级急拉急砸，始终启用。
  short_window:
    # 观察窗口长度（秒，5~3600）：当前秒的 VWAP 与 lookback_seconds 秒前的桶比较。
    # 调小只抓瞬时急拉急砸，调大会把缓慢趋势也算进来。
    # 默认：30
    lookback_seconds: 30
    # 触发所需的 ATR 倍数（(0, 20]）：窗口内位移 ÷ ATR ≥ 该值，随波动率自适应。调低提醒变多。
    # 默认：1.5
    trigger_atr_multiple: 1.5
    # 触发所需的最低实际涨跌幅（百分比，(0, 100]），与 ATR 倍数是「且」的关系。
    # 用于兜底：某些合约 ATR 极小，仅靠倍数会把微小波动放大成提醒。
    # 默认：1
    min_change_percent: 1.2
    # 需连续满足门槛的相邻秒数（1~10），不能大于 lookback_seconds。
    # 调大能过滤单秒插针，代价是提醒延迟增加、快进快出的行情可能漏报。
    # 默认：3
    confirmation_seconds: 2
    # 观察窗口内的最低成交笔数（≥1），过滤几笔成交就把价格打穿的流动性空窗。调大会让冷门合约几乎不再提醒。
    # 默认：10
    min_window_trades: 15
    # 提醒后的同一合约冷却（秒，0~86400），不分方向；合约移出池也不清除冷却记录。
    # 调小会在一轮持续行情里反复提醒，调大则可能错过反向的第二波。
    # 原则上不小于 lookback_seconds：冷却结束时上一波的起点已移出比较窗口，不会对同一波重复提醒。
    # 默认：30
    cooldown_seconds: 30
  # 长窗口：捕捉短窗口看不出的慢速单边行情（例如 3 分钟连续阴跌 3%，但每 30 秒都不到 1.2%）。
  # 要攒满 lookback_seconds 的数据才开始判定，启动或断线恢复后前几分钟不会触发。
  long_window:
    # 是否启用长窗口。关闭后只剩短窗口，行为与未加长窗口时完全一致。
    # 默认：true
    enabled: true
    # 长窗口长度（秒，60~3600），必须大于 short_window.lookback_seconds。5 分钟填 300。
    # 调大能覆盖更慢的趋势，但门槛也该相应调高，否则正常波动累积起来就会触发。
    # 默认：180
    lookback_seconds: 180
    # 长窗口的 ATR 倍数（(0, 20]）。ATR 按 K 线周期（1m）计算，窗口越长，正常波动下的位移本来就越大，
    # 所以通常要比短窗口的倍数高。
    # 默认：2
    trigger_atr_multiple: 1.8
    # 长窗口的最低涨跌幅（百分比，(0, 100]），与 ATR 倍数是「且」的关系。
    # 默认：2
    min_change_percent: 1.6
    # 长窗口需连续满足门槛的相邻秒数（1~10），不能大于长窗口长度。
    # 默认：3
    confirmation_seconds: 3
    # 长窗口内的最低成交笔数（≥1）。窗口更长，要求也应比短窗口高，才能同样过滤流动性空窗。
    # 默认：30
    min_window_trades: 30
    # 长窗口提醒后的冷却（秒，60~86400），不能小于长窗口长度，否则同一段行情会在窗口滑过期间被反复提醒。
    # 这里刻意不填写，让冷却跟随 lookback_seconds：只改窗口长度（如 300）时不必同步改冷却，也不会因冷却过短校验失败。
    # 需要比窗口更长的冷却时再取消注释。
    # 默认：未填写时等于 lookback_seconds
    # cooldown_seconds: 180

# K 线形态趋势提醒：识别连续多根同周期 K 线一路上涨或下跌、影线不长的健康单边走势，与上面的秒级异动判定相互独立。
# 3m / 5m / 15m 三个周期都由 1 分钟 K 线合成，对最近 candles 根已收盘 K 线判定，下列条件全部满足即提醒：
#   累计涨跌幅、反向 K 线根数、最大反弹比例、总实体占比、最大实体占比。
# 只描述已经形成的走势，不预测后续。每个周期各自独立：形态从不成立变为成立时提醒一次，持续成立期间不再提醒，
# 形态被破坏后重新计算，再次成立就是新的一段；不同周期之间互不影响，同一段走势可能在多个周期上各提醒一次。
# 周期 K 线在收盘后、下一分钟第一笔成交到达时判定。
trend:
  # 是否启用趋势提醒。关闭后不创建趋势检测器，也不会多拉 K 线。
  # 默认：true
  enabled: true
  # 形态持续成立时是否继续提醒。开启后每根周期 K 线收盘只要形态仍成立，就再报一条带「延续」标签的提醒；
  # 关闭后同一段走势只在形态新形成时报一次，形态被破坏后再成立才算新的一段。
  # 默认：true
  alert_continuing: true
  # 趋势合约池的 24 小时 USDT 计价成交额下限：须严格大于该值，与秒级异动的 gate.min_volume_24h_quote 互不影响。
  # 默认：10000000
  min_volume_24h_quote: 8000000
  # 成交额上限（含等于）：只看中小市值合约时设置，例如 50000000；不设（null）表示下限以上全部纳入。须大于下限。
  # 默认：null
  max_volume_24h_quote: null
  # 各周期的形态门槛，结构相同、默认值不同；某个周期只写部分字段时，其余字段取该周期自己的默认值。
  # 字段说明（以 3m 为例，其余周期相同）。不提供 1 分钟周期：噪声太大，1 分钟 K 线只作为合成各周期的单位。
  periods:
    3m:
      # 是否启用该周期。
      # 默认：true
      enabled: true
      # 参与判定的已收盘 K 线根数（3~60）。调大要求趋势持续更久，发现得更晚；调小更灵敏、噪声也更多。
      # 默认：5
      candles: 4
      # 累计涨跌幅下限（百分比，(0, 100]）：第一根开盘价到最后一根收盘价。调低提醒变多。
      # 过滤横盘里幅度很小的连阴连阳；对 BTC、ETH 这类低波动币可能偏高。
      # 默认：5
      min_change_percent: 5.0
      # 反向 K 线最多根数（必须小于 candles）：下跌时的阳线、上涨时的阴线，以及实体不足 min_candle_body_ratio 的小实体 K 线。
      # 无论取值多少，反向 K 线都只能夹在中间（首尾必须顺势），且下一根收盘要突破反向之前那根的收盘价。
      # 默认：1
      max_counter_candles: 1
      # 最大反弹比例（[0, 1]）：窗口内从滚动极值算起的最大反向回撤（按收盘价）÷ 累计位移，不能超过该值。
      # 保证夹杂的反向 K 线只是小幅回调，而不是一根大反转。调大更宽松。
      # 默认：0.3
      max_rebound_ratio: 0.3
      # 单根实体占比下限（[0, 1]）：顺势 K 线的实体 ÷ 本根振幅低于该值时视为十字星，算作反向 K 线（计入上面的根数与首尾顺势）。
      # 总实体占比按窗口合计，几根大实体会把末尾停滞的十字星、长影线 K 线摊薄，这里逐根约束每一根都在推进。调大更严格，0 表示不限制。
      # 默认：0.3
      min_candle_body_ratio: 0.3
      # 总实体占比下限（[0, 1]）：各根实体长度之和 ÷ 各根振幅之和。整体上下影线越长，比例越低。
      # 默认：0.5
      min_body_ratio: 0.6
      # 最大实体占比上限（(0, 1]）：最大一根顺势 K 线的实体 ÷ 整段累计位移（不是本根振幅），不能超过该值。
      # 保证涨跌是几根 K 线共同推出来的，排除一根急拉急砸加几根小 K 线凑出来的走势（急涨急跌由秒级异动负责）。
      # 默认：0.5
      max_single_candle_ratio: 0.6
    5m:
      # 默认：true
      enabled: true
      # 默认：4
      candles: 4
      # 默认：6
      min_change_percent: 6.0
      # 默认：1
      max_counter_candles: 0
      # 默认：0.3
      max_rebound_ratio: 0.3
      # 默认：0.5
      min_body_ratio: 0.6
      # 默认：0.3
      min_candle_body_ratio: 0.3
      # 默认：0.5
      max_single_candle_ratio: 0.6
    15m:
      # 默认：true
      enabled: true
      # 默认：3
      candles: 3
      # 默认：8
      min_change_percent: 8.0
      # 默认：0
      max_counter_candles: 0
      # 默认：0.3
      max_rebound_ratio: 0.3
      # 默认：0.5
      min_body_ratio: 0.6
      # 默认：0.3
      min_candle_body_ratio: 0.3
      # 默认：0.5
      max_single_candle_ratio: 0.6

# 放量启动提醒：最近几分钟的成交额相对自身基准期显著放大，同时价格明显移动并收盘突破基准期高点（或低点），
# 用来发现从沉寂中突然启动的币。这类币启动前 24 小时成交额往往很小，进不了上面两者的合约池，所以单独监控全市场。
# 与秒级异动、趋势提醒相互独立；由成交聚合 1 分钟 K 线，每分钟收盘（下一分钟第一笔成交到达时）判定一次。
# 重复提醒按（合约, 方向）记录上次提醒：冷却内不报；冷却后价格须比上次提醒价再推进 realert_step_percent 才报「第 N 波」；
# 上次提醒超过一个基准期后，再次满足条件就当作新的启动。
launch:
  # 是否启用放量启动提醒。关闭后不创建该检测器，也不会多订阅、多拉 K 线。
  # 默认：true
  enabled: true
  # 合约池的 24 小时 USDT 计价成交额下限（须严格大于），与另两者互不影响。默认 0 即监控 24 小时内有成交的全部虚拟币合约（约 600 个），
  # 启动预热要多拉几百次 K 线（受 gate.rest_rate_limit_per_second 约束，约 1.5 分钟，排在另两者之后）。调高会漏掉启动前成交极少的币。
  # 默认：0
  min_volume_24h_quote: 0
  # 成交额上限（含等于）：只想看小币时设置，例如 50000000；不设（null）表示不限。须大于下限。
  # 默认：null
  max_volume_24h_quote: null
  # 观察窗口（分钟，1~60）：最近这么多根已收盘 1 分钟 K 线的成交额与涨跌幅。调长对慢速启动更敏感，但报得更晚。
  # 默认：5
  window_minutes: 5
  # 基准期（分钟，30~1440，须大于窗口）：窗口之前这么长时间的平均成交额作为「平时」的量，最高/最低价作为要突破的区间。
  # 调长基准更稳、刚放过量的币更难再次触发；调短对日内节奏变化更敏感。
  # 默认：360
  baseline_minutes: 360
  # 量比下限（(1, 1000]）：窗口成交额 ÷ 基准期同长度平均成交额。基准期完全无成交时视为满足。调高提醒变少、启动报得更晚。
  # 默认：5
  min_volume_ratio: 5.0
  # 窗口成交额下限（USDT，≥ 0）：量比只衡量相对放大，冷门币几百 USDT 就能放大几十倍，必须有绝对成交额兜底。
  # 也用来剔除假启动：拉升后成交随即冷清的几乎都是窗口成交额只有几万的冷门币。回测中从 3 万提到 10 万，
  # 提醒从每天约 35 条降到约 15 条、假启动占比从 53% 降到 17%，大行情一段不漏；代价是冷门币最早的一小段会错过。
  # 默认：100000
  min_window_quote: 100000
  # 窗口涨跌幅下限（百分比，(0, 100]）：窗口开始前一根收盘到最后一根收盘。
  # 默认：3
  min_change_percent: 3.0
  # 是否要求收盘突破基准期最高价（下跌为最低价）。关闭后提醒约多 1/3，多出的多是区间内的放量反弹。
  # 默认：true
  require_breakout: true
  # 是否提醒放量下跌（与上涨分开记录冷却与波次）。
  # 默认：false
  alert_drops: false
  # 同方向两次提醒的最小间隔（分钟，1~1440，不能小于窗口）：同一段放量在窗口滑过期间不会每分钟报一次。
  # 默认：15
  cooldown_minutes: 15
  # 再次提醒要求价格比上次提醒价再推进的幅度（百分比，[0, 100]）：原地放量震荡不重复提醒，拉出新一截才报下一波。
  # 默认：5
  realert_step_percent: 5.0
  # 窗口涨跌幅上限（百分比，(0, 1000]，须大于 min_change_percent）：窗口内就走完这么多的多是插针式拉盘，提醒时已在高点，
  # 回测中超过 15% 的 15 次有 14 次 60 分钟内回落 8% 以上。超过时不提醒，但按同样的冷却与再推进规则当作提醒记入，
  # 免得窗口滑过插针、涨幅回到区间内后在高位补报；之后要过冷却并比插针收盘价再推进 realert_step_percent 才提醒。
  # 调高会报出更多插针，调低会误伤正常的强势启动；设为 null 不设上限。
  # 默认：15
  max_change_percent: 15.0

# 提醒分发通道（冷却属于判定逻辑，见 indicator 下各窗口的 cooldown_seconds）。各通道有独立队列和后台任务，发送不阻塞行情处理。
alerts:
  # 单个通道允许积压的提醒数（1~100000）。队列满时丢弃新提醒并记错误日志，绝不阻塞成交循环。
  # 通道（尤其 Webhook）长期偏慢时调大只是推迟丢弃，应先修通道；全市场同时异动的瞬时突发才适合调大。
  # 默认：1000
  queue_size: 1000
  # 是否输出控制台提醒。
  # 默认：true
  console: true
  # 控制台是否着色。重定向到文件或日志系统时建议关掉。
  # 默认：true
  console_colors: true
  # 控制台提醒时是否发声。macOS 用系统音效，其他平台用终端响铃（受终端设置影响）。
  # 默认：true
  beep: true
  # JSONL 落盘路径，相对当前工作目录解析，每行一条完整 JSON；设为 null 关闭该通道。
  # 默认：data\alerts\alerts.jsonl
  jsonl_path: data/alerts/alerts.jsonl
  # 单个 JSONL 文件的轮转阈值（字节，≥0），整文件轮转为 .1、.2……0 表示不轮转。
  # 检查在写入前进行：达到阈值仍会写完当前这条，且要等下一条提醒到来才真正轮转。
  # 默认：10000000
  jsonl_max_bytes: 10000000
  # 保留的历史 JSONL 文件数（1~100），超出的最旧文件会被删除。
  # 默认：5
  jsonl_backup_count: 5
  # Webhook 地址，null 表示不启用。环境变量 PRICE_ALERT_WEBHOOK_URL 会覆盖此项；
  # 地址通常含密钥，建议走环境变量而不是写进配置文件。
  # 默认：null
  webhook_url: null
  # Webhook 请求超时（秒，(0, 30]）。超时只记日志、不重试，也不影响其他通道。
  # 默认：5
  webhook_timeout_seconds: 5
