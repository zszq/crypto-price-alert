# 属于日常监控配置 config/default/：目录下全部 .yaml 合并成一份配置，各文件的顶层键不能重复。
# 每项上方的「默认：」是代码默认值，固定不变，调参只改取值；括号内是强制校验的取值范围，未知键直接报错。

# 反弹回落提醒：跌了一大段后伴随成交涌入的急拉（[下跌反弹]），或涨了一大段后伴随成交涌入的急砸（[冲高回落]），
# 提醒之后几分钟内更可能沿急动方向继续走。
# 急动判定与短时异动相同，另要求可以提醒的那一秒前置走势反向、成交笔数暴增、离 24 小时反向极值不远；不满足只拦这一秒、不清零确认。
# 启动、合约新入池或断线重连后要先攒满 1 小时成交才会提醒；K 线不满 24 小时的合约（新上线）不报。
# 现行取值是第三轮的方案 B（确认 2 秒、反向极值 ≤ 10%，其余同代码默认值）。第三轮样本外（2025-04~09，写定后只运行一次）：
# 每天约 1.5 条（代码默认值约 3 条）；1~5 分钟每个整分钟点都没回到入场价另一侧的 54.2%（代码默认值 47.6%，差 +6.6 [+1.5, +11.4]，
# 随机时刻随机方向 23%），5 分钟后在提醒方向一侧的 72%；去掉的都是代码默认值会报的提醒，它们本身只有 41%。
# 补充检验（2024-10~2025-03，三轮都没用过）：每天约 1 条，hold5 51.7%（代码默认值 45.8%），差 +5.9 [-0.5, +12.6] 区间跨 0，未通过写定判据。
# 依据见 research/move_accuracy/move_accuracy.md 第十二节。
reversal:
  # 是否启用。关闭后不创建该检测器、不订阅它的合约池；move、trend、launch、dormant、reversal 至少要启用一个。
  # 默认：true
  enabled: true
  # 合约池准入门槛：24 小时 USDT 计价成交额须严格大于该值（其他提醒的合约池各自设置），2026-10 约 30 个合约。
  # 调低纳入更多小币，但更不准：500 万门槛第二轮样本外 47.7%（800 万 51.1%）、提醒多约 40%。
  # 默认：8000000
  min_volume_24h_quote: 8000000
  # 成交额上限（含等于）：只看中小市值合约时设置，例如 50000000；不设（null）表示下限以上全部纳入。须大于下限。
  # 默认：null
  max_volume_24h_quote: null
  # 以下六项是急动窗口，判定与短时异动的短窗口相同（秒级 VWAP、基准价、ATR、连续确认、空档复核）。
  #
  # 急动窗口长度（秒，5~600）：当前秒的 VWAP 与这么多秒前的 VWAP 比较。研究里 10 秒最准，窗口越长越接近随机。
  # 默认：10
  lookback_seconds: 10
  # 急动的最低涨跌幅（百分比，(0, 100]），与 ATR 倍数是「且」的关系。调低提醒变多；
  # 在现行取值上 1% 与 2% 第三轮样本外都不如 1.5%（51.9% / 49.7%，现行 54.2%），1.5% 附近是平坦区。
  # 默认：1.5
  min_change_percent: 1.5
  # 急动的 ATR 倍数（(0, 20]）：窗口内价格变动（绝对值）÷ ATR ≥ 该值，ATR 为 14 根 1 分钟 K 线的 Wilder ATR（不开放配置）。
  # 研究里约八成提醒的 1 分钟 ATR 低于 1.5%，对它们涨跌幅门槛更严；这一项主要挡住平时每分钟就动 1.5% 以上的高波动币的日常波动。
  # 研究只试过 1，调高主要减少高波动币的提醒。
  # 默认：1
  trigger_atr_multiple: 1.0
  # 需连续满足门槛的相邻秒数（1~10），不能大于 lookback_seconds。调大能过滤单秒插针，提醒晚一秒、少约 1/4。
  # 单独调到 2 在第二轮样本外更准（约 56%）、第三轮样本外没有提升，与反向极值一起用才明显更准。
  # 默认：1
  confirmation_seconds: 2
  # 急动窗口内的最低成交笔数（≥1），过滤几笔成交就把价格打穿的流动性空窗。
  # 成交暴增条件已经要求大量成交，调到 20 研究结果完全相同。
  # 默认：5
  min_window_trades: 5
  # 同一合约提醒后的冷却（秒，0~86400），从提醒那一刻算起，不分方向，合约移出池也不清除。
  # 30 秒只挡同一波急动连着报；调到 300 去掉同一波稍后再报的重复提醒，第三轮两段样本外都略准（57.4% / 53.5%，
  # 现行 54.2% / 51.7%）、提醒少约 1/8，但写定的选参规则没选它。
  # 默认：30
  cooldown_seconds: 30
  # 前置走势的回看长度（秒，60~86400）：取急动窗口开始前这么多秒那一刻的价格，到窗口起点（基准价）算涨跌幅。
  # 研究比较过 300 秒，选中的是 900 秒；调短只看最近几分钟的下跌（上涨），调长把更早、已经消化的走势也算进来。
  # 默认：900
  prior_seconds: 900
  # 前置走势至少逆着急动方向走了这么多（百分比，(0, 100]）：急拉之前至少跌了这么多，急砸之前至少涨了这么多。
  # 去掉这一条件第二轮样本外方向保持率掉到 22%（顺着此前走势的放量急动回吐最狠）。
  # 调大只报此前走得更远之后的反向急动、提醒更少：第二轮（确认 1 秒、不限反向极值）调到 8 更准一些、少约 1/4；
  # 在现行取值上第三轮样本外 4% 与 8% 都略差（51.2% / 52.2%）。
  # 默认：6
  min_prior_move_percent: 6.0
  # 成交笔数暴增（(0, 60)）：最近 1 分钟成交笔数 ÷ 最近 1 小时每分钟平均笔数的下限。两个长度固定、不开放配置，
  # 全部成交都落在最近 1 分钟时倍数才到 60。要先攒满 1 小时成交才会判定（启动、新入池、断线重连后都是）。
  # 去掉这一条件第二轮样本外掉到 30%。调高更准、提醒少得多：在现行取值上第三轮样本外 12 倍 51.0%、24 倍 56.8%（提醒少一半多）。
  # 默认：16
  min_trade_burst_ratio: 16.0
  # 离 24 小时反向极值的上限（百分比，(0, 100]，必须大于 min_change_percent；null 不限）：触发价离此前 24 小时已收盘 1 分钟 K 线的
  # 最低价（急拉）/ 最高价（急砸）不超过这么多，即只报刚从 24 小时低点 / 高点附近拉起 / 砸下的急动。
  # 开启后启动、新入池与断线回补时 1 分钟 K 线预热从 50 根变为 1442 根（合约同时在其他 1 分钟检测器的池里时共用一次请求），
  # K 线不满 24 小时的合约（新上线）不报。
  # 第三轮样本外单独加这一项 50.6%、与确认 2 秒一起 54.2%；调到 5 更准一些（57.5%）、提醒少约 1/4，调大则逐渐接近不限。
  # 默认：null
  max_extreme_distance_percent: 10.0
