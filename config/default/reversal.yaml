# 属于日常监控配置 config/default/：目录下全部 .yaml 合并成一份配置，各文件的顶层键不能重复。
# 每项上方的「默认：」是代码默认值，固定不变，调参只改取值；括号内是强制校验的取值范围，未知键直接报错。

# 反弹回落提醒：跌了一大段后伴随成交涌入的急拉（[下跌反弹]），或涨了一大段后伴随成交涌入的急砸（[冲高回落]），
# 提醒之后几分钟内更可能沿急动方向继续走。
# 急动判定与瞬时、短时异动相同，另要求可以提醒的那一秒前置走势反向、成交笔数暴增、离 24 小时反向极值不远；不满足只拦这一秒、不清零确认。
# 启动、合约新入池或断线重连后，用 REST 历史成交补上之前 1 小时才会提醒（一般一两分钟，补不上时按退避重试）；K 线不满 24 小时的合约（新上线）不报。
# 现行取值开了反向极值 ≤ 10%，同时放宽涨跌幅、成交暴增、确认秒数与合约池，准确率与代码默认值相近、提醒更多。
reversal:
  # 是否启用。关闭后不创建该检测器、不订阅它的合约池；instant、spike、trend、launch、dormant、reversal 至少要启用一个。
  # 默认：true
  enabled: true
  # 合约池准入门槛：24 小时 USDT 计价成交额须严格大于该值（其他提醒的合约池各自设置），800 万时约 30 个合约。
  # 调低纳入更多小币、提醒更多，但更不准；低于 500 万没有验证过。
  # 默认：8000000
  min_volume_24h_quote: 5000000
  # 成交额上限（含等于）：只看中小市值合约时设置，例如 50000000；不设（null）表示下限以上全部纳入。须大于下限。
  # 默认：null
  max_volume_24h_quote: null
  # 以下六项是急动窗口，判定与瞬时、短时异动的短窗口相同（秒级 VWAP、基准价、ATR、连续确认、空档复核）。
  #
  # 急动窗口长度（秒，5~600）：当前秒的 VWAP 与这么多秒前的 VWAP 比较。窗口越长，提醒后的方向越接近随机。
  # 默认：10
  lookback_seconds: 10
  # 急动的最低涨跌幅（百分比，(0, 100]），与 ATR 倍数是「且」的关系。调低提醒变多；1%~2% 之间准确率差别不大，1.5% 左右最好。
  # 默认：1.5
  min_change_percent: 1.25
  # 急动的 ATR 倍数（(0, 20]）：窗口内价格变动（绝对值）÷ ATR ≥ 该值，ATR 为 14 根 1 分钟 K 线的 Wilder ATR（不开放配置）。
  # 约八成提醒的 1 分钟 ATR 低于 1.5%，对它们涨跌幅门槛更严；这一项主要挡住平时每分钟就动 1.5% 以上的高波动币的日常波动，
  # 调高主要减少高波动币的提醒。
  # 默认：1
  trigger_atr_multiple: 1.0
  # 需连续满足门槛的相邻秒数（1~10），不能大于 lookback_seconds。调大能过滤单秒插针，提醒晚一秒、少约 1/4。
  # 单独调到 2 不一定更准，与反向极值一起用才明显更准。
  # 默认：1
  confirmation_seconds: 1
  # 急动窗口内的最低成交笔数（≥1），过滤几笔成交就把价格打穿的流动性空窗。
  # 成交暴增条件已经要求大量成交，调高这一项基本不起作用。
  # 默认：5
  min_window_trades: 5
  # 同一合约提醒后的冷却（秒，0~86400），从提醒那一刻算起，不分方向，合约移出池也不清除。
  # 30 秒只挡同一波急动连着报；调到 300 能去掉同一波稍后再报的重复提醒，略准、提醒少约 1/8。
  # 默认：30
  cooldown_seconds: 30
  # 前置走势的回看长度（秒，60~86400）：取急动窗口开始前这么多秒那一刻的价格，到窗口起点（基准价）算涨跌幅。
  # 调短只看最近几分钟的下跌（上涨），调长把更早、已经消化的走势也算进来。
  # 默认：900
  prior_seconds: 900
  # 前置走势至少逆着急动方向走了这么多（百分比，(0, 100]）：急拉之前至少跌了这么多，急砸之前至少涨了这么多。
  # 这是最关键的条件：顺着此前走势的放量急动回吐最狠。调大只报此前走得更远之后的反向急动、提醒更少，但不一定更准。
  # 默认：6
  min_prior_move_percent: 6.0
  # 成交笔数暴增（(0, 60)）：最近 1 分钟成交笔数 ÷ 最近 1 小时每分钟平均笔数的下限。两个长度固定、不开放配置，
  # 全部成交都落在最近 1 分钟时倍数才到 60。要有之前 1 小时的成交，启动、新入池、断线重连后由 REST 补上。
  # 去掉这一条件明显不准。调高更准、提醒少得多。
  # 默认：16
  min_trade_burst_ratio: 12.0
  # 离 24 小时反向极值的上限（百分比，(0, 100]，必须大于 min_change_percent；null 不限）：触发价离此前 24 小时已收盘 1 分钟 K 线的
  # 最低价（急拉）/ 最高价（急砸）不超过这么多，即只报刚从 24 小时低点 / 高点附近拉起 / 砸下的急动。
  # 开启后启动、新入池与断线回补时 1 分钟 K 线预热从 50 根变为 1442 根（合约同时在其他 1 分钟检测器的池里时共用一次请求），
  # K 线不满 24 小时的合约（新上线）不报。
  # 与确认 2 秒一起用才明显更准；调到 5 更准一些、提醒少约 1/4，调大则逐渐接近不限。
  # 默认：null
  max_extreme_distance_percent: 10.0
