# 属于日常监控配置 config/default/：目录下全部 .yaml 合并成一份配置，各文件的顶层键不能重复。
# 每项上方的「默认：」是代码默认值，固定不变，调参只改取值；括号内是强制校验的取值范围，未知键直接报错。

# 反弹回落提醒：急跌一大段之后伴随成交突然涌入的急拉（[下跌反弹]），或急涨一大段之后伴随成交突然涌入的急砸（[冲高回落]），
# 提醒之后几分钟内更可能沿急动方向继续走。与其他提醒相互独立，合约池单独设置。
# 急动本身的判定与秒级异动相同（秒级成交量加权均价、ATR、连续确认、冷却），另要求下面两个条件在可以提醒的那一秒同时满足：
# 前置走势反向、成交笔数暴增；不满足只拦这一秒、不清零确认。启动、合约新入池或断线重连后要先攒满 1 小时成交才会提醒。
# 样本外（2025-10~2026-03）：每天约 3 条；1、3、5、10 分钟后价格在提醒方向一侧的约 67%、71%、70%、70%，
# 1~5 分钟每个整分钟点都没回到入场价另一侧的 51%（随机时刻随机方向 22%）。依据见 research/move_accuracy/move_accuracy.md。
reversal:
  # 是否启用反弹回落提醒。关闭后不创建该检测器，也不订阅、预热它的合约池。
  # 默认：true
  enabled: true
  # 合约池：24 小时 USDT 计价成交额严格大于下限、且不超过上限（null 不限）。500 万门槛样本外更不准、提醒多约 40%。
  # 默认：8000000
  min_volume_24h_quote: 8000000
  # 默认：null
  max_volume_24h_quote: null
  # 急动窗口长度（秒，5~600）：当前秒与该秒数之前的完整秒比较。研究里 10 秒最准，窗口越长越接近随机。
  # 默认：10
  lookback_seconds: 10
  # 急动的最低涨跌幅（百分比，(0, 100]），与 ATR 倍数是「且」的关系。
  # 默认：1.5
  min_change_percent: 1.5
  # 急动的 ATR 倍数（(0, 20]），ATR 为 14 根 1 分钟 K 线的 Wilder ATR。
  # 默认：1
  trigger_atr_multiple: 1.0
  # 需连续满足门槛的相邻秒数（1~10），不能大于 lookback_seconds。调到 2 样本外更准一些（约 56%）但少报约 1/4。
  # 默认：1
  confirmation_seconds: 1
  # 窗口内最低成交笔数（≥1）。
  # 默认：5
  min_window_trades: 5
  # 同一合约提醒后的冷却（秒，0~86400），不分方向。
  # 默认：30
  cooldown_seconds: 30
  # 前置走势的回看长度（秒，60~86400）：从窗口开始前这么多秒到窗口起点。
  # 默认：900
  prior_seconds: 900
  # 前置走势至少逆着急动方向走了这么多（百分比，(0, 100]）：急拉之前至少跌了这么多，急砸之前至少涨了这么多。
  # 去掉这一条件样本外方向保持率掉到 22%（顺着此前走势的放量急动回吐最狠）；调到 8 更准一些、提醒少约 1/4。
  # 默认：6
  min_prior_move_percent: 6.0
  # 成交笔数暴增（(0, 60)）：最近 1 分钟成交笔数 ÷ 最近 1 小时每分钟平均笔数的下限。所有成交都在最近 1 分钟时才到 60，
  # 所以必须小于 60。去掉这一条件样本外方向保持率掉到 30%。
  # 默认：16
  min_trade_burst_ratio: 16.0
