# Gate.io 虚拟币 USDT 永续合约价格异动监控配置（日常监控）。
# 日常监控的配置是整个 config/default/ 目录：全部 .yaml 按顶层键合并，各文件的顶层键不能重复。
# 本文件放交易所连接（gate）与提醒分发（alerts），每种提醒各一个文件：instant、spike、launch、trend、dormant、reversal。
# 括号内是强制校验的取值范围；未知键直接报错，删掉某项则用代码默认值（漏掉整个文件会被配置测试拦下）。
# 每项上方的「默认：」是代码默认值，固定不变；调参只改取值，不改这行注释。
# 改动阈值属于行为变更，提交说明中需写明运营影响。

# 交易所连接、合约池筛选与限流。
gate:
  # REST 根地址，用于拉合约列表与 K 线。
  # 默认：https://api.gateio.ws/api/v4
  rest_url: https://api.gateio.ws/api/v4
  # WebSocket 行情地址（futures.trades 逐笔成交），须与 settle 对应。
  # 默认：wss://fx-ws.gateio.ws/v4/ws/usdt
  websocket_url: wss://fx-ws.gateio.ws/v4/ws/usdt
  # 结算币种，目前只支持 usdt。
  # 默认：usdt
  settle: usdt
  # 退出门槛比例 (0, 1]，所有检测器共用：已在池中的合约，成交额 ≤ 下限 × 该比例（或 > 上限 ÷ 该比例）才移除，
  # 免得边界附近的合约反复进出；越小越不容易移除，1 表示进出同一条线。
  # 默认：0.8
  universe_exit_volume_ratio: 0.8
  # 合约池刷新周期（秒，60~86400），变化走增量订阅、不断线。调小更快发现新热门合约，REST 负担更重。
  # 默认：600
  universe_refresh_seconds: 600
  # 单个 REST 请求的超时（秒，(0, 60]）。网络慢时调大，否则预热会因超时反复重试。
  # 默认：15
  rest_timeout_seconds: 15
  # 单个 REST 请求的最大尝试次数（1~10，含首次），只重试 408/429/5xx 与网络、JSON 解析类临时错误。
  # 遇到 429 应调小下面的速率，而不是调高这里。
  # 默认：3
  rest_retries: 3
  # 所有 REST 出口共用的平均速率上限（次/秒，(0, 1000]）：合约池再大、重连再频繁，也只是拉长预热或回补的耗时。
  # 日志出现 429 就调小。
  # 默认：10
  rest_rate_limit_per_second: 10
  # 令牌桶攒满后可一次放行的瞬时额度（1~1000），让启动预热不必逐个等令牌。
  # Gate 公共接口每个端点每 10 秒 200 次，这里所有端点共用一个桶，比官方口径更保守。
  # 默认：20
  rest_rate_limit_burst: 20
  # ATR 预热与断线回补共用的并发上限（1~32），峰值并发不叠加；实际速率仍受令牌桶约束。
  # 默认：8
  warmup_concurrency: 8
  # 单条订阅消息携带的合约数（1~500）。Gate 一批中有一个无效合约就整批失败、改为逐个重订阅，
  # 分片过大时回退代价更高，过小则订阅轮次变多。
  # 默认：100
  subscription_chunk_size: 100
  # 连续多少秒收不到数据消息（成交或订阅应答）就判定连接已死并重连（秒，(0, 300]）。
  # ping/pong 不重置该计时；调小在全市场冷清时容易误判。
  # 默认：30
  receive_timeout_seconds: 30
  # 实时成交允许的最大滞后（秒，(0, 300]）：链路积压时推送的已是旧行情，超限就主动重连清空积压。
  # 频繁出现「行情数据滞后」应排查网络或系统时钟，而不是调高该值。
  # 默认：10
  max_data_lag_seconds: 10
  # 断线重连的指数退避初始等待（秒，(0, 60]），收到第一笔成交后重置。
  # 默认：1
  reconnect_initial_seconds: 1
  # 退避上限（秒，(0, 300]），不能小于 reconnect_initial_seconds。调大减少故障期间的无效重连，恢复后连上更慢。
  # 默认：30
  reconnect_max_seconds: 30
  # 「监控正常」日志的最小间隔（秒，(0, 3600]），打印监控合约数与累计成交笔数。
  # 在处理成交后检查，全市场无成交时不输出，不是严格心跳。
  # 默认：60
  status_interval_seconds: 60

# 提醒分发通道（冷却属于判定逻辑，在各提醒的配置里）。各通道有独立队列和后台任务，发送不阻塞行情处理。
alerts:
  # 单个通道允许积压的提醒数（1~100000），队列满时丢弃新提醒并记错误日志。
  # 通道长期偏慢时调大只是推迟丢弃，应先修通道；应对全市场同时异动的瞬时突发才适合调大。
  # 默认：1000
  queue_size: 1000
  # 是否输出控制台提醒。
  # 默认：true
  console: true
  # 控制台是否着色。重定向到文件或日志系统时建议关掉。
  # 默认：true
  console_colors: true
  # 控制台提醒时是否发声。Windows 与 macOS 按提醒类型播放内置合成音效（cli sounds 可试听），
  # 其他平台用终端响铃（受终端设置影响）。
  # 默认：true
  beep: true
  # JSONL 落盘路径，相对当前工作目录解析，每行一条完整 JSON；设为 null 关闭该通道。
  # 默认：data/alerts/alerts.jsonl
  jsonl_path: data/alerts/alerts.jsonl
  # 单个 JSONL 文件的轮转阈值（字节，≥0），整文件轮转为 .1、.2……0 表示不轮转。在写入下一条前检查。
  # 默认：10000000
  jsonl_max_bytes: 10000000
  # 保留的历史 JSONL 文件数（1~100），超出的最旧文件会被删除。
  # 默认：5
  jsonl_backup_count: 5
  # Webhook 地址，null 表示不启用。环境变量 PRICE_ALERT_WEBHOOK_URL 会覆盖此项（地址常含密钥，建议走环境变量）。
  # 默认：null
  webhook_url: null
  # Webhook 请求超时（秒，(0, 30]）。超时只记日志、不重试，也不影响其他通道。
  # 默认：5
  webhook_timeout_seconds: 5
