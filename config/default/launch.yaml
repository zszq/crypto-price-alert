# 属于日常监控配置 config/default/：目录下全部 .yaml 合并成一份配置，各文件的顶层键不能重复。
# 每项上方的「默认：」是代码默认值，固定不变，调参只改取值；括号内是强制校验的取值范围，未知键直接报错。

# 放量启动提醒：最近几分钟的成交额相对基准期显著放大，同时价格明显移动（可选要求收盘突破基准期高点或低点），
# 用来发现从沉寂中突然启动的币。这类币启动前成交额往往很小，进不了秒级异动与趋势的合约池，所以单独设一个门槛更低的合约池。
# 由成交聚合 1 分钟 K 线，每分钟收盘（下一分钟第一笔成交到达时）判定一次。
# 放量上涨（rise）与放量下跌（fall）是两个独立的检测器，两段的键完全相同、各自设置。
# 冷却内不报；冷却后价格须比上次提醒价再推进 realert_step_percent 才报「第 N 波」；上次提醒超过一个基准期后再满足条件就是新的启动。
launch:
  # 放量上涨。取值未改（research/launch_trade/launch_grid.md 第三轮：选出的一组样本外准确率略低于这组，按判据维持）。
  rise:
    # 是否启用。关闭的方向不创建检测器、不多订阅。
    # 默认：true
    enabled: true
    # 合约池的 24 小时 USDT 计价成交额下限（须严格大于）。代码默认 100 万：回测中低于它的币拉升后多半没人跟进，
    # 启动中的币通常第一波过后就会入池。调低能更早报到冷门币的第一波（设为 0 约 600 个合约，启动预热约 1.5 分钟）；
    # 调高会漏掉更多启动前成交少的币。
    # 默认：1000000
    min_volume_24h_quote: 500000
    # 成交额上限（含等于）：只想看小币时设置，例如 50000000；不设（null）表示不限。须大于下限。
    # 默认：null
    max_volume_24h_quote: null
    # 观察窗口（分钟，1~60）：最近这么多根已收盘 1 分钟 K 线的成交额与涨跌幅。调长对慢速启动更敏感，但报得更晚。
    # 默认：5
    window_minutes: 5
    # 基准期（分钟，30~1440，须大于窗口）：窗口之前这段的平均成交额是「平时」的量，最高/最低价是要突破的区间。
    # 调长基准更稳、刚放过量的币更难再次触发；调短对日内节奏更敏感。
    # 默认：360
    baseline_minutes: 360
    # 量比下限（(1, 1000]）：量比 = 窗口成交额 ÷ 基准期内同样长度的平均成交额
    #（例：前 6 小时平均每 5 分钟成交 1 万，最近 5 分钟成交 8 万，量比为 8）。基准期完全无成交时视为满足。调高提醒变少、启动报得更晚。
    # 默认：3
    min_volume_ratio: 3.0
    # 窗口成交额下限（USDT，≥ 0）：量比只衡量相对放大，冷门币几百 USDT 就能放大几十倍，要有绝对成交额兜底。
    # 回测中从 3 万提到 10 万，提醒从每天约 35 条降到约 15 条、假启动占比从 53% 降到 17%，大行情一段不漏，
    # 代价是冷门币最早的一小段会错过。
    # 默认：100000
    min_window_quote: 100000
    # 是否要求收盘突破基准期最高价（下跌为最低价）。关闭后提醒约多 1/3，多出的多是区间内的放量反弹。
    # 默认：true
    require_breakout: false
    # 同一合约两次提醒的最小间隔（分钟，1~1440，不能小于窗口），窗口滑过期间不会每分钟报一次。
    # 默认：15
    cooldown_minutes: 10
    # 再次提醒要求价格比上次提醒价再推进的幅度（百分比，[0, 100]）：原地放量震荡不重复提醒，拉出新一截才报下一波。
    # 默认：5
    realert_step_percent: 5.0
    # 窗口涨跌幅下限（百分比，(0, 100]）：从窗口开始前一根 K 线的收盘价到最后一根的收盘价，下跌按绝对值比较（上限同理）。
    # 默认：3
    min_change_percent: 3.0
    # 窗口涨跌幅上限（百分比，(0, 1000]，须大于 min_change_percent）：窗口内就走完这么多的多是插针式拉盘，提醒时已在高点；
    # 回测中超过 15% 的 15 次有 14 次在之后 60 分钟内最低价比提醒价低 8% 以上。
    # 超过时不提醒，但当作提醒记入冷却与再推进，免得窗口滑过插针后在高位补报。
    # 调高会报出更多插针，调低会误伤正常的强势启动；null 不设上限。
    # 默认：15
    max_change_percent: 15.0
  # 放量下跌。每一项的含义、取值范围与上面 rise 相同（突破看基准期最低价，涨跌幅按跌幅的绝对值）。
  # 取值来自 research/launch_trade/launch_grid.md 第三轮（F0.5 选参，通过过拟合判据）：样本外准确率 0.359 → 0.409，
  # ≥20% 的急跌在前半段报到 25% → 49%，代价是提醒多约 1/3（每天约 52 → 69 条）。
  fall:
    # 默认：false
    enabled: true
    # 默认：1000000
    min_volume_24h_quote: 1000000
    # 默认：null
    max_volume_24h_quote: null
    # 默认：5
    window_minutes: 5
    # 默认：360
    baseline_minutes: 180
    # 默认：3
    min_volume_ratio: 2.0
    # 默认：100000
    min_window_quote: 50000
    # 默认：true
    require_breakout: false
    # 默认：15
    cooldown_minutes: 15
    # 默认：5
    realert_step_percent: 3.0
    # 默认：3
    min_change_percent: 3.0
    # 默认：15
    max_change_percent: 15.0
