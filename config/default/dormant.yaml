# 属于日常监控配置 config/default/：目录下全部 .yaml 合并成一份配置，各文件的顶层键不能重复。
# 每项上方的「默认：」是代码默认值，固定不变，调参只改取值；括号内是强制校验的取值范围，未知键直接报错。

# 冷门启动提醒：之前 24 小时几乎没人交易的币，最近几分钟突然连续有成交、价格明显拉升，与其他提醒相互独立。
# 由实时成交聚合 1 分钟 K 线，每分钟收盘判定一次，下面的门槛全部满足即提醒；只提醒上涨，冷却内再涨够步长报「第 N 波」。
# 准确率低于放量上涨（样本外：提醒之后先涨 3%~5% 的比例约 0.44，放量上涨约 0.44；随便挑一个冷门时刻约 0.06），
# 是知情后作为例外采用的；依据与检验见 research/launch_trade/dormant_solo.md、dormant_calm.md、dormant_early.md、dormant_best.md。
dormant:
  # 是否启用。关闭后不创建冷门启动检测器，也不会多订阅、多拉 K 线。
  # 默认：true
  enabled: true
  # 合约池的 24 小时 USDT 计价成交额下限（须严格大于）。0 即所有有成交的币。
  # 默认：0
  min_volume_24h_quote: 0
  # 合约池的成交额上限（含等于，须大于下限）。冷门与否由检测器按自己的 K 线判断（见 max_prior_quote），这里只是不必订阅
  # 早就不冷门的币；要明显高于 max_prior_quote：拉升会推高 24 小时成交额，贴得太近的话刚启动的币会在合约池刷新时被移出。
  # 约 550 个合约，启动预热每个要拉约 1450 根 K 线，受 gate.rest_rate_limit_per_second 约束约 1 分钟。null 不设上限。
  # 默认：3000000
  max_volume_24h_quote: 3000000
  # 观察窗口（分钟，1~60）：最近这么多根已收盘 1 分钟 K 线的涨幅、成交额与有成交的分钟数。
  # 这里的 15、窗口成交额 2 万、有成交 8 分钟、最后一分钟成交额与后半窗口占比五项取 research/launch_trade/dormant_early.md
  # 第三轮「假启动更少」，判据未通过（PBO 0.58），是用户知情后的例外。样本外（dormant_best.md 第三节）：准确率与原参数
  # 相同（0.445），每天假启动少 12%、早报分低 11%，即只靠少报；放开全部条件重新选参也没有找到更好的稳健方案。
  # 默认：10
  window_minutes: 15
  # 冷门门槛（USDT，> 0）：窗口之前 24 小时的成交额不超过它才算冷门。调高会把本来就有人交易的币也算进来。
  # 默认：1000000
  max_prior_quote: 1000000
  # 窗口成交额下限（USDT，≥ 0）。
  # 默认：5000
  min_window_quote: 20000
  # 窗口内有成交的分钟数下限（1~60，不能大于 window_minutes）：冷门币一两笔单子就能拉出涨幅，要求多分钟有成交才算有人在持续买。
  # 默认：5
  min_active_minutes: 8
  # 窗口涨幅下限（百分比，(0, 100]）：窗口开始前一根 K 线的收盘价到最后一根的收盘价。
  # 默认：8
  min_change_percent: 8.0
  # 窗口内单分钟收盘涨幅上限（百分比，(0, 100]）：一两分钟跳上去的多是几笔单子拉的，之后容易回落。
  # min_change_percent 不能大于 window_minutes × 它，否则永远不会提醒。
  # 默认：5
  max_minute_change_percent: 5.0
  # 窗口总实体占比下限（0~1，各根 K 线实体之和 ÷ 振幅之和）：上影线多说明冲高被砸回，拉升没站稳，不提醒。0 即不限。
  # 默认：0.6
  min_body_ratio: 0.6
  # 涨幅至少是涨前波动的多少倍（≥ 0）：涨前波动是窗口之前 240 分钟平均每分钟的真实波幅，一字横盘为 0（倍数无穷大）。
  # 涨前本来就来回乱跳的币，同样的涨幅倍数低，不报。0 即不限。
  # 默认：10
  min_calm_multiple: 10
  # 涨前波动上限（百分比/分钟，> 0）：倍数只看相对大小，涨前来回乱跳的币涨得够多也能过，这一项要求涨前近乎一条直线。
  # 回测中加 0.5 准确率不变、提醒少约两成。null 即不限。
  # 默认：0.5
  max_pre_volatility_percent: 0.5
  # 窗口最后一分钟成交额下限（USDT，≥ 0）：拉到最后一分钟已经没人买的，多是前面几笔单子拉完就停了。0 即不限。
  # 默认：0
  min_last_minute_quote: 1000
  # 后半窗口（最后 ⌈window_minutes / 2⌉ 分钟，15 分钟窗口即最后 8 分钟）成交额占窗口成交额的比例下限（0 ≤ x < 1）：
  # 成交集中在前半段、后面买盘跟不上的拉升容易回落。0 即不限。
  # 默认：0
  min_late_quote_share: 0.4
  # 冷却（分钟，1~1440，不能小于窗口）：距上次提醒（含补报）不足这么久时，只有价格比上次提醒再涨 realert_step_percent 才再报。
  # 超过冷却再满足条件就当作新的启动。拉升之后之前 24 小时的成交额很快超过冷门门槛，自然不再提醒。
  # 默认：60
  cooldown_minutes: 60
  # 冷却期内价格比上次提醒价再涨这么多（百分比，(0, 100]）就再报「冷门启动·第N波」，第一次没注意到也不至于整段错过。
  # 回测中补报的准确率不低于第一次提醒，每天多约 1.6 条。设为 null 即冷却内不再报。
  # 默认：3
  realert_step_percent: 3.0
