# 属于日常监控配置 config/default/：目录下全部 .yaml 合并成一份配置，各文件的顶层键不能重复。
# 每项上方的「默认：」是代码默认值，固定不变，调参只改取值；括号内是强制校验的取值范围，未知键直接报错。

# 冷门启动提醒：之前 24 小时几乎没人交易的币，最近几分钟突然连续有成交、价格明显拉升。
# 每分钟收盘判定一次，门槛全部满足即提醒；只提醒上涨，冷却内再涨够步长报「第 N 波」。
# 准确率低于放量上涨（提醒后先涨 3%~5% 的不到一半，但远高于随便挑一个冷门时刻），看到提醒不代表一定会继续涨。
dormant:
  # 是否启用。关闭后不创建检测器、不多订阅；现行一组（main）与慢启动一组（slow）都不报。
  # 默认：true
  enabled: true
  # 合约池的 24 小时 USDT 计价成交额下限（须严格大于）。0 即所有有成交的币。
  # 默认：0
  min_volume_24h_quote: 0
  # 合约池的成交额上限（含等于，须大于下限，null 不设）。冷门与否由检测器按 K 线判断（见 max_prior_quote），这里只是不订阅
  # 早就不冷门的币；要明显高于 max_prior_quote：拉升会推高 24 小时成交额，贴得太近的话刚启动的币会被移出合约池。
  # 约 550 个合约，启动预热约 1 分钟。
  # 默认：3000000
  max_volume_24h_quote: 3000000
  # 以下两组共用上面的开关、合约池与 1 分钟 K 线，门槛与冷却各自独立：各自满足即各自提醒，
  # 同一分钟都满足时各报一条（现行一组在前）。
  #
  # 现行一组：10~15 分钟内涨 8% 的快启动，始终启用，提醒标签是「冷门启动」。
  main:
    # 观察窗口（分钟，1~60）：最近这么多根已收盘 1 分钟 K 线的涨幅、成交额与有成交的分钟数。
    # 现行的窗口 15、窗口成交额 2 万、有成交 8 分钟、最后一分钟成交额与后半窗口占比五项比代码默认值假启动更少，
    # 准确率相同，只是少报、报得稍晚。
    # 默认：10
    window_minutes: 15
    # 冷门门槛（USDT，> 0）：窗口之前 24 小时的成交额不超过它才算冷门。调高会把本来就有人交易的币也算进来。
    # 默认：1000000
    max_prior_quote: 1000000
    # 窗口成交额下限（USDT，≥ 0）。
    # 默认：5000
    min_window_quote: 20000
    # 窗口内有成交的分钟数下限（1~60，不能大于 window_minutes）：冷门币一两笔单子就能拉出涨幅，多分钟有成交才算有人持续买。
    # 默认：5
    min_active_minutes: 8
    # 窗口涨幅下限（百分比，(0, 100]）：窗口开始前一根 K 线的收盘价到最后一根的收盘价。
    # 默认：8
    min_change_percent: 8.0
    # 窗口内单分钟收盘涨幅上限（百分比，(0, 100]）：一两分钟跳上去的多是几笔单子拉的，之后容易回落。
    # min_change_percent 不能大于 window_minutes × 它，否则永远不会提醒。
    # 默认：5
    max_minute_change_percent: 5.0
    # 窗口总实体占比下限（0~1，各根实体之和 ÷ 振幅之和）：上影线多说明冲高被砸回、没站稳。0 即不限。
    # 默认：0.6
    min_body_ratio: 0.6
    # 涨幅至少是涨前波动的多少倍（≥ 0）：涨前波动是窗口之前 240 分钟平均每分钟的真实波幅，一字横盘为 0（倍数无穷大）。
    # 涨前本就乱跳的币倍数低，不报。0 即不限。
    # 默认：10
    min_calm_multiple: 10
    # 涨前波动上限（百分比/分钟，> 0）：倍数只看相对大小，这一项要求涨前近乎一条直线。
    # 加上它准确率不变、提醒少约两成。null 即不限。
    # 默认：0.5
    max_pre_volatility_percent: 0.5
    # 窗口最后一分钟成交额下限（USDT，≥ 0）：最后一分钟已没人买的，多是几笔单子拉完就停了。0 即不限。
    # 默认：0
    min_last_minute_quote: 1000
    # 后半窗口（最后 ⌈window_minutes / 2⌉ 分钟）成交额占比下限（0 ≤ x < 1）：后面买盘跟不上的拉升容易回落。0 即不限。
    # 默认：0
    min_late_quote_share: 0.4
    # 冷却（分钟，1~1440，不能小于窗口）：距上次提醒（含补报）不足这么久时，价格比上次提醒再涨 realert_step_percent 才再报；
    # 超过冷却再满足条件就是新的启动。
    # 默认：60
    cooldown_minutes: 60
    # 冷却期内价格比上次提醒价再涨这么多（百分比，(0, 100]）就再报「冷门启动·第N波」，null 即冷却内不再报。
    # 补报的准确率不低于第一次提醒。
    # 默认：3
    realert_step_percent: 3.0
  # 冷门慢启动：涨前 240 分钟近乎一条直线、之后 60 分钟量价缓慢拉升的冷门币（现行一组报不到这种形态），
  # 提醒标签是「冷门慢启动」。各键含义与 main 相同，没写的键取慢启动自己的代码默认值（不沿用 main）；
  # 效率、量比、回落与跟踪补报只有这一组有。
  # 准确率比现行一组更低，代码默认关闭；「涨前越平稳、拉升越顺滑」并不意味着越准，看到提醒不代表会继续涨。
  slow:
    # 是否启用慢启动一组（上面的 dormant.enabled 关闭时这一组也不报）。
    # 默认：false
    enabled: true
    # 观察窗口（分钟，1~120）：比现行一组长，看的是一两个小时里的缓慢拉升。
    # 默认：60
    window_minutes: 60
    # 默认：1000000
    max_prior_quote: 1000000
    # 默认：10000
    min_window_quote: 10000
    # 窗口内有成交的分钟数下限（1~120，不能大于窗口）：取窗口的 80%，缓慢拉升也要几乎每分钟都有人买。
    # 默认：48
    min_active_minutes: 48
    # 默认：6
    min_change_percent: 6.0
    # 单分钟收盘涨幅上限：「缓慢」拉升不靠一两根跳涨。
    # 默认：3
    max_minute_change_percent: 3.0
    # 实体占比与涨幅相对涨前波动的倍数没有针对慢启动定过门槛，不限。
    # 默认：0
    min_body_ratio: 0
    # 默认：0
    min_calm_multiple: 0
    # 涨前波动上限：「平时基本没起伏」。
    # 默认：0.2
    max_pre_volatility_percent: 0.2
    # 默认：0
    min_last_minute_quote: 0
    # 后半窗口（最后 30 分钟）成交额占比下限：「量在放大」。
    # 比代码默认值放宽：准确率基本不变，提醒稍多、报得更早。
    # 默认：0.5
    min_late_quote_share: 0.4
    # 效率下限（0~1）：窗口净涨幅价差 ÷ 逐分钟收盘价差绝对值之和，越接近 1 越是一路往上。0 即不限。
    # 默认：0.3
    min_efficiency: 0.3
    # 量比下限（≥ 0）：窗口成交额 ÷ 之前 24 小时同长度的平均成交额（之前 24 小时没有成交时视为满足）。0 即不限。
    # 默认：3
    min_volume_ratio: 3.0
    # 从窗口最高价回落的比例上限（0~1）：（窗口最高价 − 最新收盘）÷（窗口最高价 − 窗口起点），提醒时要还在高位附近。null 即不限。
    # 默认：0.3
    max_retrace: 0.3
    # 冷却内的第 N 波由下面的跟踪补报负责。
    # 默认：120
    cooldown_minutes: 120
    # 冷却内的第 N 波要求条件仍满足，慢启动后涨前波动、效率很快不满足，几乎报不出来，所以改用下面的跟踪补报。
    # 默认：null
    realert_step_percent: null
    # 跟踪补报：提醒（含补报）后收盘价比上次提醒价再涨这么多（百分比，(0, 100]）就补报「冷门慢启动·第N波」，不看其他条件；
    # null 即不跟踪。补报的准确率比第一次提醒高；步长调小补报更多，多到比第一次提醒还多。
    # 默认：null
    follow_step_percent: 5.0
    # 距上次提醒（含补报）超过这么久（分钟，1~1440）没再涨够步长就停止跟踪。
    # 默认：240
    follow_minutes: 240
