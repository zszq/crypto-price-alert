# 属于日常监控配置 config/default/：目录下全部 .yaml 合并成一份配置，各文件的顶层键不能重复。
# 每项上方的「默认：」是代码默认值，固定不变，调参只改取值；括号内是强制校验的取值范围，未知键直接报错。

# 瞬时异动提醒：几十秒到几分钟内的位移同时达到最低涨跌幅与 ATR 倍数，并连续几秒保持同一方向，用来发现急拉急砸。
# 原名「短时异动」：研究第四轮（research/move_accuracy/move_accuracy.md 第十三节）发现这类提醒之后价格多半回吐，
# 就把只报逆势、成交涌入的方案 A 做成新的短时异动（spike.yaml），原来的这一种改名瞬时异动保留，急拉急砸都报、数量多。
# 两者判定代码相同，合约池、冷却、秒级数据各自独立；提醒标签分别是 [瞬时急涨]/[瞬时急跌] 与 [短时急涨]/[短时急跌]。
# ATR 衡量这个币平时一根 K 线的波动：高波动币要动得更多才报，低波动币小幅急动也能报。
# 成交按秒聚合（成交量加权均价），下一秒第一笔成交到达时判定上一秒。短、长两个窗口各自判定、各自冷却。
# 门槛类条件（窗口起点有价格、窗口成交笔数、涨跌幅、ATR 倍数）任一不满足就重置确认进度；
# 无成交的空秒（按上一成交价补齐）和空档后价格复核失败只禁止提醒，确认进度保留。
instant:
  # 是否启用。关闭后不创建该检测器、不订阅它的合约池；instant、spike、trend、launch、dormant、reversal 至少要启用一个。
  # 默认：true
  enabled: true
  # 合约池准入门槛：24 小时 USDT 计价成交额须严格大于该值（其他提醒的合约池各自设置）。调低纳入更多小币，假信号也多。
  # 默认：10000000
  min_volume_24h_quote: 8000000
  # ATR 使用的 K 线周期，仅支持 1m / 5m / 15m。越长 ATR 越平滑、门槛越稳，对波动率变化反应越慢。
  # 默认：1m
  candle_interval: 1m
  # Wilder ATR 的平滑周期（2~200）。调大更平滑、更抗单根异常 K 线，门槛跟随波动率也更慢。
  # 默认：14
  atr_period: 14
  # 启动时预拉的 K 线根数（15~500），必须大于 atr_period；未收盘的当前 K 线用来初始化实时 K 线，不计入 ATR。
  # 调大让初始 ATR 更接近稳态，启动 REST 负担更重。
  # 默认：50
  warmup_candles: 50
  # ATR 过期保护（秒，30~3600），按最近计入 ATR 的 K 线收盘时间计算，超过则停止判定；不能小于两个 K 线周期。
  # 调大能容忍更长缺口，但可能拿过期波动率发提醒。
  # 默认：未填写时取 3 个 K 线周期（1m 下为 180）
  max_atr_age_seconds: 180
  # 以下两个观察窗口共用上面的 K 线、ATR 和秒级成交数据，门槛、确认和冷却各自独立：
  # 各自满足即各自提醒，同一秒都满足时各报一条（短窗口在前）；冷却只从本窗口自己的上一次提醒算起。
  #
  # 短窗口：捕捉秒级急拉急砸，始终启用。
  short_window:
    # 观察窗口长度（秒，5~3600）：当前秒的 VWAP 与这么多秒前的 VWAP 比较。调大会把缓慢趋势也算进来。
    # 默认：30
    lookback_seconds: 30
    # 触发所需的 ATR 倍数（(0, 20]）：窗口内价格变动（绝对值）÷ ATR ≥ 该值，随波动率自适应。调低提醒变多。
    # 默认：1.5
    trigger_atr_multiple: 1.5
    # 触发所需的最低涨跌幅（百分比，(0, 100]），与 ATR 倍数是「且」的关系：ATR 极小的合约仅靠倍数会把微小波动报出来。
    # 默认：1
    min_change_percent: 1.3
    # 需连续满足门槛的相邻秒数（1~10），不能大于 lookback_seconds。调大能过滤单秒插针，提醒更晚、快进快出的行情可能漏报。
    # 默认：3
    confirmation_seconds: 2
    # 观察窗口内的最低成交笔数（≥1），过滤几笔成交就把价格打穿的流动性空窗。调大会让冷门合约几乎不再提醒。
    # 默认：10
    min_window_trades: 15
    # 同一合约在本窗口提醒后的冷却（秒，0~86400），不分方向，合约移出池也不清除。
    # 调小会在持续行情里反复提醒，调大可能错过反向的第二波；原则上不小于 lookback_seconds，免得同一波重复提醒。
    # 默认：30
    cooldown_seconds: 30
  # 长窗口：捕捉短窗口看不出的慢速单边行情（例如 3 分钟连续阴跌 3%，但每 30 秒都不到 1.2%）。
  # 要攒满 lookback_seconds 的数据才开始判定，启动或断线恢复后前几分钟不会触发。
  long_window:
    # 是否启用长窗口。关闭后只剩短窗口。
    # 默认：true
    enabled: true
    # 长窗口长度（秒，60~3600），必须大于 short_window.lookback_seconds。调大时门槛也该相应调高，否则正常波动累积就会触发。
    # 默认：180
    lookback_seconds: 180
    # 长窗口的 ATR 倍数（(0, 20]）。窗口越长，正常波动下的位移本来就越大，通常要比短窗口的倍数高。
    # 默认：2
    trigger_atr_multiple: 1.8
    # 长窗口的最低涨跌幅（百分比，(0, 100]），与 ATR 倍数是「且」的关系。
    # 默认：2
    min_change_percent: 1.6
    # 长窗口需连续满足门槛的相邻秒数（1~10），不能大于长窗口长度。
    # 默认：3
    confirmation_seconds: 3
    # 长窗口内的最低成交笔数（≥1），窗口更长，要求也应比短窗口高。
    # 默认：30
    min_window_trades: 30
    # 长窗口提醒后的冷却（秒，60~86400），不能小于长窗口长度，否则同一段行情会在窗口滑过期间反复提醒。
    # 刻意不填写，让冷却跟随 lookback_seconds；需要更长的冷却时再取消注释。
    # 默认：未填写时等于 lookback_seconds
    # cooldown_seconds: 180
  # 连续提醒：同一合约的短窗口同方向提醒一条接一条，说明行情在单边延续而不是一次插针，
  # 此时追加一条 [瞬时急涨·连续急涨]/[瞬时急跌·连续急跌]，累计涨跌幅从第一条提醒的窗口起点算起。只有瞬时异动有连续提醒。
  # 反向的短窗口提醒或间隔超限从头计数，长窗口提醒不参与也不打断；每串只报一次，
  # 整段累计涨跌与提醒方向不一致时（冷却期里急跌又拉回）先不报，等方向一致再报。
  streak:
    # 是否启用连续提醒。关闭后短窗口提醒照常发出，只是不再追加。
    # 默认：true
    enabled: true
    # 连续几条同向短窗口提醒时追加（2~10）。调到 2 会报出大量插针余波，调高则一天也碰不到一次。
    # 默认：3
    min_alerts: 3
    # 间隔容差（秒，1~3600）：相邻两条同向短窗口提醒的间隔不超过 short_window.cooldown_seconds + 该值才算连续。
    # 调小只认冷却一过立刻再报的急行情，调大会把中途歇过一阵的行情也串起来。
    # 默认：30
    gap_tolerance_seconds: 30
