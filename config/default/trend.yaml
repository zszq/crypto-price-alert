# 属于日常监控配置 config/default/：目录下全部 .yaml 合并成一份配置，各文件的顶层键不能重复。
# 每项上方的「默认：」是代码默认值，固定不变，调参只改取值；括号内是强制校验的取值范围，未知键直接报错。

# K 线形态趋势提醒：识别连续多根同周期 K 线一路上涨或下跌、影线不长的健康单边走势，与秒级异动、放量启动相互独立。
# 3m / 5m / 15m 三个周期都由 1 分钟 K 线合成，对最近 candles 根已收盘 K 线判定，下面各周期的门槛全部满足即提醒。
# 只描述已经形成的走势，不预测后续。每个周期各自独立：形态从不成立变为成立时提醒，持续成立期间是否再报见 alert_continuing，
# 形态被破坏后再次成立就是新的一段；不同周期之间互不影响，同一段走势可能在多个周期上各提醒一次。
# 周期 K 线在收盘后、下一分钟第一笔成交到达时判定。
trend:
  # 是否启用趋势提醒。关闭后不创建趋势检测器，也不会多拉 K 线。
  # 默认：true
  enabled: true
  # 形态持续成立时是否继续提醒。开启后每根周期 K 线收盘只要形态仍成立，就再报一条带「延续」标签的提醒；
  # 关闭后同一段走势只在形态新形成时报一次，形态被破坏后再成立才算新的一段。
  # 默认：true
  alert_continuing: true
  # 趋势合约池的 24 小时 USDT 计价成交额下限：须严格大于该值，与秒级异动的 move.min_volume_24h_quote 互不影响。
  # 默认：10000000
  min_volume_24h_quote: 3000000
  # 成交额上限（含等于）：只看中小市值合约时设置，例如 50000000；不设（null）表示下限以上全部纳入。须大于下限。
  # 默认：null
  max_volume_24h_quote: null
  # 各周期的形态门槛，结构相同、默认值不同；某个周期只写部分字段时，其余字段取该周期自己的默认值。
  # 字段说明（以 3m 为例，其余周期相同）。不提供 1 分钟周期：噪声太大，1 分钟 K 线只作为合成各周期的单位。
  periods:
    3m:
      # 是否启用该周期。
      # 默认：true
      enabled: true
      # 参与判定的已收盘 K 线根数（3~60）。调大要求趋势持续更久，发现得更晚；调小更灵敏、噪声也更多。
      # 默认：5
      candles: 5
      # 累计涨跌幅下限（百分比，(0, 100]）：第一根开盘价到最后一根收盘价。调低提醒变多。
      # 过滤横盘里幅度很小的连阴连阳；对 BTC、ETH 这类低波动币可能偏高。
      # 默认：5
      min_change_percent: 5.0
      # 反向 K 线最多根数（0~59，必须小于 candles）：下跌时的阳线、上涨时的阴线，以及实体不足 min_candle_body_ratio 的小实体 K 线。
      # 无论取值多少，反向 K 线都只能夹在中间（首尾必须顺势），且下一根收盘要突破反向之前那根的收盘价。
      # 默认：1
      max_counter_candles: 0
      # 最大反弹比例（[0, 1]）：按收盘价算，上涨时从此前最高点（起点为第一根开盘价）回落的最大幅度 ÷ 整段累计涨幅，
      # 不能超过该值；下跌反之。
      # 保证夹杂的反向 K 线只是小幅回调，而不是一根大反转。调大更宽松。
      # 默认：0.3
      max_rebound_ratio: 0.3
      # 单根实体占比下限（[0, 1]）：顺势 K 线的实体 ÷ 本根振幅低于该值时视为十字星，算作反向 K 线（计入上面的根数与首尾顺势）。
      # 总实体占比按窗口合计，几根大实体会把末尾停滞的十字星、长影线 K 线摊薄，这里逐根约束每一根都在推进。调大更严格，0 表示不限制。
      # 默认：0.3
      min_candle_body_ratio: 0.1
      # 总实体占比下限（[0, 1]）：各根实体长度之和 ÷ 各根振幅之和。整体上下影线越长，比例越低。
      # 默认：0.5
      min_body_ratio: 0.5
      # 最大实体占比上限（(0, 1]）：最大一根顺势 K 线的实体 ÷ 整段累计涨跌幅度（不是本根振幅），不能超过该值。
      # 保证涨跌是几根 K 线共同推出来的，排除一根急拉急砸加几根小 K 线凑出来的走势（急涨急跌由秒级异动负责）。
      # 默认：0.5
      max_single_candle_ratio: 0.6
    5m:
      # 默认：true
      enabled: true
      # 默认：4
      candles: 4
      # 默认：6
      min_change_percent: 5.0
      # 默认：1
      max_counter_candles: 0
      # 默认：0.3
      max_rebound_ratio: 0.3
      # 默认：0.3
      min_candle_body_ratio: 0.1
      # 默认：0.5
      min_body_ratio: 0.5
      # 默认：0.5
      max_single_candle_ratio: 0.6
    15m:
      # 默认：true
      enabled: true
      # 默认：3
      candles: 3
      # 默认：8
      min_change_percent: 6.0
      # 默认：0
      max_counter_candles: 0
      # 默认：0.3
      max_rebound_ratio: 0.3
      # 默认：0.3
      min_candle_body_ratio: 0.1
      # 默认：0.5
      min_body_ratio: 0.5
      # 默认：0.5
      max_single_candle_ratio: 0.6
